<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LearnLoop — Dashboard MVP</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#192637;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1160px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:24px;font-weight:800;color:#164c75}.sub{color:#65748a;font-size:13px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tabs button{background:#fff;border:1px solid #d9e2ef;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:650;color:#40556c}.tabs button.active{background:#155b90;color:white}.panel{background:#fff;border:1px solid #e0e7f1;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 5px 20px #203f6210}h2{margin:0 0 14px;font-size:20px}h3{margin:16px 0 10px}p{line-height:1.5}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd7e5;border-radius:9px;background:white;color:#23374b;font:inherit}textarea{min-height:85px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.field{margin:0 0 12px}.btn{background:#15679d;color:#fff;border:0;padding:11px 15px;border-radius:9px;font-weight:650;cursor:pointer}.btn.secondary{background:#edf3fa;color:#1e527d}.btn.danger{background:#b23d43}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#67798e;font-size:13px}.stat{background:#f0f5fa;border-radius:12px;padding:16px}.stat strong{font-size:24px;display:block}.item{border:1px solid #dce5ef;padding:13px;border-radius:11px;margin:10px 0}.pill{display:inline-block;background:#e9f1fa;border-radius:20px;padding:4px 9px;font-size:12px;color:#245779}.ok{color:#137547}.err{color:#b23442}.option{display:block;width:100%;text-align:left;padding:13px;border:1px solid #d4e0eb;background:#fff;border-radius:10px;margin:8px 0;cursor:pointer}.option.selected{background:#e4f2ff;border-color:#176ba6}.bar{height:10px;border-radius:9px;background:#e4ebf4;overflow:hidden}.bar span{display:block;background:#237ab5;height:100%}.hidden{display:none!important}pre{white-space:pre-wrap;overflow:auto;background:#f1f5f9;padding:12px;border-radius:8px}.notice{padding:12px;background:#fff8e9;border-radius:10px;font-size:13px;color:#785f20}.footer{font-size:12px;color:#78869a;margin:24px 0} @media(max-width:600px){.shell{padding:12px}.panel{padding:15px}.head{align-items:flex-start}}

:root{--ink:#15283f;--blue:#2859a5}body{background:#f5f7fc}.shell{max-width:1200px}.head{padding:12px 0}.brand{font-size:25px;letter-spacing:-.8px}.panel{box-shadow:0 10px 30px #142e5010;border-color:#e7ecf4}.tabs{background:white;padding:7px;border-radius:14px;border:1px solid #e3e9f2}.tabs button{flex:1}.tabs button.active{background:#233f75}.btn{background:#274c8e}.btn.secondary{background:#eaf0fb}.stat{background:#f2f5fb}.hero{padding:30px;border-radius:19px;background:linear-gradient(120deg,#1c3567,#315ca0);color:white;margin-bottom:16px}.hero h1{margin:5px 0;font-size:29px}.hero p{color:#e0eafa}.hero .btn{background:white;color:#23467c}.auth{max-width:430px;margin:9vh auto}.auth .panel{padding:30px}.auth h1{margin:4px 0 8px}.auth .brand{margin-bottom:22px}.auth .notice{margin-top:16px}.rolecard{border:1px solid #dce4f1;padding:13px;border-radius:12px;cursor:pointer;background:#fff}.rolecard:has(input:checked){border-color:#2859a5;background:#f0f5ff}.rolecard input{width:auto}.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.quick .item{background:#fff;margin:0;min-height:112px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:#7790b2;font-weight:700}.headeractions{display:flex;align-items:center;gap:8px}.avatar{background:#dfeafa;border-radius:50%;height:35px;width:35px;display:grid;place-items:center;font-weight:800;color:#254f8c}.smallbtn{border:0;background:#edf2fa;padding:9px 12px;border-radius:9px;cursor:pointer;color:#2b4d7d;font-weight:650}@media(max-width:600px){.hero{padding:20px}.hero h1{font-size:23px}.auth{margin:5vh auto}.auth .panel{padding:20px}.head{flex-wrap:wrap}.tabs button{padding:10px 8px;font-size:12px}}
</style></head><body><main class="shell"><details class="panel" id="tieCloud"><summary style="cursor:pointer;font-weight:700">Cloud Tutor · Guided practice</summary><div id="tieCloudHost" style="margin-top:18px"></div></details><div id="appHeader"></div><div id="authHost"></div><div id="appBody" class="hidden"><nav class="tabs" id="tabs"></nav><section id="screen"></section><div class="footer">LearnLoop v0.2 interface prototype · Data stored on this device only · Not production authentication</div></div></main><script>
const K='learnloop_mvp_01';const example=[{id:'m1',stem:'What are the roots of x² − 5x + 6 = 0?',options:['1 and 6','2 and 3','−2 and −3','−1 and −6'],correct:1,explanation:'(x − 2)(x − 3) = 0, so the roots are 2 and 3.',subject:'Mathematics',topic:'Quadratic Equations',difficulty:'easy',pathway:'school',status:'approved'},{id:'m2',stem:'For x² − 9 = 0, the sum of the real roots is:',options:['−9','0','3','9'],correct:1,explanation:'The roots are +3 and −3; their sum is 0.',subject:'Mathematics',topic:'Quadratic Equations',difficulty:'easy',pathway:'school',status:'approved'},{id:'m3',stem:'The discriminant of 2x² − 4x + 3 = 0 is:',options:['−8','8','−4','4'],correct:0,explanation:'b² − 4ac = 16 − 24 = −8.',subject:'Mathematics',topic:'Quadratic Equations',difficulty:'medium',pathway:'school',status:'approved'},{id:'m4',stem:'If the roots of x² − 7x + k = 0 are 3 and 4, then k is:',options:['7','10','12','14'],correct:2,explanation:'The product of roots is k = 3 × 4 = 12.',subject:'Mathematics',topic:'Quadratic Equations',difficulty:'medium',pathway:'school',status:'approved'},{id:'m5',stem:'Which equation has exactly one distinct real root?',options:['x² + 1 = 0','x² − 4 = 0','x² − 2x + 1 = 0','x² − 5x + 6 = 0'],correct:2,explanation:'(x − 1)² = 0 has a repeated real root.',subject:'Mathematics',topic:'Quadratic Equations',difficulty:'hard',pathway:'school',status:'approved'},{id:'p1',stem:'Which House of the Indian Parliament is a continuing chamber?',options:['Lok Sabha','Rajya Sabha','Both Houses','Neither House'],correct:1,explanation:'The Rajya Sabha is not subject to dissolution.',subject:'Indian Polity',topic:'Parliament',difficulty:'easy',pathway:'exam',status:'approved'},{id:'p2',stem:'A Money Bill can be introduced in:',options:['Either House','Rajya Sabha only','Lok Sabha only','A joint sitting'],correct:2,explanation:'A Money Bill can be introduced only in the Lok Sabha.',subject:'Indian Polity',topic:'Parliament',difficulty:'medium',pathway:'exam',status:'approved'},{id:'s1',stem:'Which component commonly measures angular velocity in a drone?',options:['Gyroscope','Barometer','GPS receiver','Magnetometer'],correct:0,explanation:'A gyroscope measures angular velocity.',subject:'Drone Technology',topic:'Flight Control',difficulty:'easy',pathway:'skill',status:'approved'}];
const seed=()=>({questions:example,quizzes:[{id:'q1',title:'Quadratic Equations Practice',pathway:'school',subject:'Mathematics',topic:'Quadratic Equations',mode:'practice',duration:0,questionIds:['m1','m2','m3','m4','m5'],published:true},{id:'q2',title:'Mathematics Timed Exam',pathway:'school',subject:'Mathematics',topic:'Quadratic Equations',mode:'exam',duration:180,questionIds:['m1','m2','m3','m4','m5'],published:true},{id:'q3',title:'UPSC Polity Practice',pathway:'exam',subject:'Indian Polity',topic:'Parliament',mode:'practice',duration:0,questionIds:['p1','p2'],published:true},{id:'q4',title:'Drone Skills Practice',pathway:'skill',subject:'Drone Technology',topic:'Flight Control',mode:'practice',duration:0,questionIds:['s1'],published:true}],attempts:[]});let db;try{db=JSON.parse(localStorage.getItem(K))||seed()}catch(e){db=seed()}const save=()=>localStorage.setItem(K,JSON.stringify(db));save();let tab='dashboard',active=null,tick=null;let session=JSON.parse(sessionStorage.getItem('learnloop_demo_session')||'null');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uniq=a=>[...new Set(a)];const btn=(t,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${t}</button>`;function resetDemo(){if(confirm('Reset all demo data and results?')){db=seed();save();active=null;clearInterval(tick);render()}}function demoLogin(){const role=$('loginRole').value;const name=$('loginName').value.trim();if(!name)return alert('Enter a display name');session={name,role};sessionStorage.setItem('learnloop_demo_session',JSON.stringify(session));tab='dashboard';render()}
function logout(){session=null;sessionStorage.removeItem('learnloop_demo_session');active=null;clearInterval(tick);render()}
function loginView(){return `<div class="auth"><div class="panel"><div class="brand">◈ LearnLoop</div><div class="eyebrow">Learning and assessment</div><h1>Welcome back</h1><p class="muted">Sign in to your learning workspace.</p><div class="field"><label>Your name</label><input id="loginName" placeholder="Enter your name" autocomplete="off"></div><div class="field"><label>Continue as</label><select id="loginRole"><option value="student">Student</option><option value="teacher">Teacher</option><option value="admin">Administrator</option></select></div><button class="btn" style="width:100%" onclick="demoLogin()">Continue to dashboard →</button><div class="notice"><b>Demo login only.</b> This screen does not verify identity or protect data. Do not enter a real password or personal information. For a real account and saved tutor progress, open Cloud Tutor above.</div></div></div>`}
function nav(t){tab=t;active=null;clearInterval(tick);render()}
function render(){if(!session){$('appHeader').innerHTML='';$('authHost').innerHTML=loginView();$('appBody').classList.add('hidden');return} $('authHost').innerHTML='';$('appBody').classList.remove('hidden');$('appHeader').innerHTML=`<div class="head"><div><div class="brand">◈ LearnLoop <span class="pill">v0.2 Demo</span></div><div class="sub">Your learning workspace</div></div><div class="headeractions"><div class="avatar">${esc(session.name.charAt(0).toUpperCase())}</div><div><b>${esc(session.name)}</b><div class="sub">${esc(session.role)}</div></div><button class="smallbtn" onclick="logout()">Sign out</button></div></div>`;const allowed=session.role==='student'?{dashboard:'Home',student:'My Quizzes',analytics:'My Progress'}:session.role==='teacher'?{dashboard:'Home',teacher:'Question Bank & Quizzes',analytics:'Analytics'}:{dashboard:'Home',admin:'Admin',teacher:'Teacher Workspace',student:'Student Preview',analytics:'Analytics'};if(!allowed[tab])tab='dashboard';$('tabs').innerHTML=Object.entries(allowed).map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="nav('${k}')">${v}</button>`).join('');$('screen').innerHTML=tab==='dashboard'?dashboard():tab==='student'?student():tab==='teacher'?teacher():tab==='admin'?admin():analytics();if(active)renderAttempt()}
function dashboard(){const name=esc(session.name.split(' ')[0]);const role=session.role;const attempts=db.attempts;const approved=db.questions.filter(q=>q.status==='approved').length;const pending=db.questions.filter(q=>q.status==='pending').length;const practice=attempts.filter(a=>a.mode==='practice');const exams=attempts.filter(a=>a.mode==='exam');const acc=a=>{const n=a.reduce((s,x)=>s+x.total,0);return n?Math.round(a.reduce((s,x)=>s+x.score,0)*100/n)+'%':'—'};const intro=role==='student'?['Ready to learn something new?','Pick a practice quiz, sit a timed exam, or review your progress.']:role==='teacher'?['Build better assessments','Import questions, review content and publish quizzes for your learners.']:['Your platform at a glance','Monitor content, assessment activity and teacher workflows.'];const stats=role==='student'?[['Practice accuracy',acc(practice)],['Exam accuracy',acc(exams)],['Quizzes completed',attempts.length],['Available quizzes',db.quizzes.filter(q=>q.published).length]]:role==='teacher'?[['Approved questions',approved],['Pending review',pending],['Published quizzes',db.quizzes.filter(q=>q.published).length],['Student attempts',attempts.length]]:[['Questions',db.questions.length],['Approved',approved],['Quizzes',db.quizzes.length],['Attempts',attempts.length]];const actions=role==='student'?[['Explore quizzes','Practice by topic or take a timed test',"nav('student')"],['View progress','Separate practice and exam performance',"nav('analytics')"]]:role==='teacher'?[['Manage question bank','Import and approve questions',"nav('teacher')"],['View performance','See quiz and topic analytics',"nav('analytics')"]]:[['Manage content','Review questions and publish quizzes',"nav('teacher')"],['Platform overview','Check coverage and activity',"nav('admin')"],['Student preview','Experience quizzes as a learner',"nav('student')"]];return `<div class="hero"><div class="eyebrow" style="color:#b7c9ed">${esc(role)} dashboard</div><h1>Welcome, ${name}</h1><p>${intro[0]} ${intro[1]}</p><button class="btn" onclick="${actions[0][2]}">${actions[0][0]} →</button></div><div class="grid" style="margin-bottom:16px">${stats.map(([label,value])=>`<div class="panel" style="margin:0"><div class="muted">${label}</div><div style="font-size:29px;font-weight:800;margin-top:9px">${value}</div></div>`).join('')}</div><div class="panel"><h2>Quick actions</h2><div class="quick">${actions.map(([title,desc,action])=>`<div class="item"><h3 style="margin:0 0 8px">${title}</h3><p class="muted">${desc}</p><button class="btn secondary" onclick="${action}">Open →</button></div>`).join('')}</div></div>${role==='student'?`<div class="panel"><h2>Recent activity</h2>${attempts.slice(-3).reverse().map(a=>`<div class="item"><b>${esc(a.title)}</b> <span class="pill">${a.mode}</span><p class="muted">${a.score}/${a.total} correct</p></div>`).join('')||'<p class="muted">No attempts yet. Start your first quiz to see your progress here.</p>'}</div>`:''}<div class="notice">Prototype notice: sign-in is simulated; analytics and data are local to this browser. No real account security or cloud sync yet.</div>`}
function student(){return `<div class="panel"><h2>Available quizzes</h2><p class="muted">Select a pathway, then begin an untimed practice session or timed exam. Adaptive practice prioritises questions based on earlier results.</p><div class="grid">${db.quizzes.filter(q=>q.published).map(q=>`<div class="item"><span class="pill">${esc(q.pathway)}</span> <span class="pill">${q.mode==='exam'?'Timed exam':'Untimed practice'}</span><h3>${esc(q.title)}</h3><p class="muted">${esc(q.subject)} · ${esc(q.topic)} · ${q.questionIds.length} questions${q.mode==='exam'?' · '+Math.ceil(q.duration/60)+' min':''}</p>${btn('Start '+(q.mode==='exam'?'exam':'practice'),`start('${q.id}')`)}</div>`).join('')}</div></div><div id="attemptHost"></div>`}
function selectAdaptive(q){const qs=q.questionIds.map(id=>db.questions.find(x=>x.id===id)).filter(x=>x?.status==='approved');if(q.mode==='exam')return qs;const seen={};db.attempts.filter(a=>a.mode==='practice').forEach(a=>a.responses.forEach(r=>{let x=seen[r.id]||(seen[r.id]={n:0,c:0});x.n++;x.c+=r.correct?1:0}));return qs.sort((a,b)=>{let aa=seen[a.id]||{n:0,c:0},bb=seen[b.id]||{n:0,c:0};return (aa.c/(aa.n||1)+aa.n*.05)-(bb.c/(bb.n||1)+bb.n*.05)}).slice(0,Math.min(qs.length,10))}
function start(id){const q=db.quizzes.find(x=>x.id===id);if(!q)return;const questions=selectAdaptive(q);if(!questions.length)return alert('No approved questions.');active={quiz:q,questions,answers:{},index:0,started:Date.now(),deadline:q.mode==='exam'?Date.now()+q.duration*1000:null,submitted:false};renderAttempt();if(q.mode==='exam'){clearInterval(tick);tick=setInterval(()=>{if(!active)return clearInterval(tick);if(Date.now()>=active.deadline)finish();else{const el=$('clock');if(el)el.textContent=Math.max(0,Math.ceil((active.deadline-Date.now())/1000))+'s'}},300)}}
function renderAttempt(){if(!active)return;const a=active,q=a.questions[a.index];const time=a.deadline?`<strong id="clock">${Math.max(0,Math.ceil((a.deadline-Date.now())/1000))}s</strong>`:'<span class="pill">Untimed</span>';const host=$('attemptHost')||$('screen');host.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>${esc(a.quiz.title)}</h2>${time}</div><p class="muted">Question ${a.index+1} of ${a.questions.length} · ${esc(q.difficulty)} · ${esc(q.topic)}</p><div class="bar"><span style="width:${100*(a.index+1)/a.questions.length}%"></span></div><h3>${esc(q.stem)}</h3>${q.options.map((o,i)=>`<button class="option ${a.answers[q.id]===i?'selected':''}" onclick="answer(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}${a.quiz.mode==='practice'&&a.answers[q.id]!==undefined?`<div class="notice">${a.answers[q.id]===q.correct?'Correct. ':'Not quite. '}${esc(q.explanation)}</div>`:''}<div class="row" style="margin-top:16px">${btn('Previous','step(-1)','secondary')}${btn(a.index===a.questions.length-1?'Finish':'Next',a.index===a.questions.length-1?'finish()':'step(1)')}${btn('Submit now','finish()','secondary')}</div></div>`}
function answer(i){if(!active)return;const q=active.questions[active.index];if(active.quiz.mode==='practice'&&active.answers[q.id]!==undefined)return;active.answers[q.id]=i;renderAttempt()}function step(d){if(!active)return;active.index=Math.max(0,Math.min(active.questions.length-1,active.index+d));renderAttempt()}function finish(){if(!active||active.submitted)return;active.submitted=true;clearInterval(tick);const a=active;const responses=a.questions.map(q=>({id:q.id,selected:a.answers[q.id]??null,correct:a.answers[q.id]===q.correct,subject:q.subject,topic:q.topic,difficulty:q.difficulty}));const score=responses.filter(r=>r.correct).length;db.attempts.push({id:'a'+Date.now(),quizId:a.quiz.id,title:a.quiz.title,mode:a.quiz.mode,at:new Date().toISOString(),total:responses.length,score,elapsed:Math.round((Date.now()-a.started)/1000),responses});save();active=null;render();$('attemptHost').innerHTML=`<div class="panel"><h2>Result: ${score} / ${responses.length}</h2><p>${Math.round(100*score/responses.length)}% accuracy · ${a.quiz.mode==='exam'?'Timed exam':'Practice'} · ${Math.round((Date.now()-a.started)/1000)} seconds</p>${btn('View analytics',"nav('analytics')")}</div>`}
function teacher(){const pending=db.questions.filter(q=>q.status==='pending');return `<div class="panel"><h2>Teacher workspace</h2><p class="muted">Import JSON, review questions, create quizzes, and publish. Imported questions are never automatically approved.</p><div class="grid"><div><h3>Import question package</h3><div class="field"><label>JSON file</label><input type="file" id="file" accept=".json,application/json"></div>${btn('Validate and import','importFile()')}<p class="muted">Accepts the Sprint 1 package format (schema_version 1.0).</p></div><div><h3>Create quiz</h3><div class="field"><label>Title</label><input id="quizTitle" placeholder="e.g. Algebra Revision"></div><div class="field"><label>Subject</label><select id="quizSubject">${uniq(db.questions.filter(q=>q.status==='approved').map(q=>q.subject)).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="grid"><div class="field"><label>Mode</label><select id="quizMode"><option value="practice">Practice</option><option value="exam">Exam</option></select></div><div class="field"><label>Exam duration (minutes)</label><input id="quizMinutes" type="number" min="1" value="5"></div></div>${btn('Create and publish','createQuiz()')}</div></div></div><div class="panel"><h2>Question review queue (${pending.length})</h2>${pending.length?pending.map(q=>`<div class="item"><b>${esc(q.stem)}</b><p class="muted">${esc(q.subject)} · ${esc(q.topic)} · ${esc(q.difficulty)}</p><p>${q.options.map((o,i)=>`${'ABCD'[i]}. ${esc(o)}`).join(' · ')}</p><p class="muted">Proposed answer: ${'ABCD'[q.correct]} · ${esc(q.explanation)}</p>${btn('Approve',`review('${q.id}','approved')`)} ${btn('Reject',`review('${q.id}','rejected')`,'danger')}</div>`).join(''):'<p class="muted">No questions pending review.</p>'}</div><div class="panel"><h2>Published quizzes</h2>${db.quizzes.map(q=>`<div class="item"><b>${esc(q.title)}</b> <span class="pill">${q.mode}</span> <span class="pill">${q.published?'Published':'Draft'}</span><p class="muted">${q.questionIds.length} questions · ${esc(q.subject)}</p></div>`).join('')}</div>`}
function review(id,status){const q=db.questions.find(x=>x.id===id);if(q){q.status=status;save();render()}}
async function importFile(){const f=$('file').files[0];if(!f)return alert('Select a JSON file.');try{const data=JSON.parse(await f.text());if(data.schema_version!=='1.0'||!Array.isArray(data.questions)||!data.questions.length)throw Error('Expected schema_version 1.0 and nonempty questions array');let added=0;const ids=new Set(db.questions.map(q=>q.id));for(const r of data.questions){if(r.type!=='single_select'||!r.stem||!Array.isArray(r.options)||r.options.length!==4||!r.explanation)throw Error('Invalid question format: each question needs stem, four options and explanation');const keys=r.options.map(o=>o.key);if(keys.join(',')!=='A,B,C,D'||!keys.includes(r.correct_option)||r.options.some(o=>!o.text))throw Error('Options must have A–D keys and a valid correct_option');const id=String(r.external_id||'import-'+Date.now()+'-'+added);if(ids.has(id))continue;db.questions.push({id,stem:r.stem,options:r.options.map(o=>o.text),correct:keys.indexOf(r.correct_option),explanation:r.explanation,subject:data.subject||'General',topic:(data.topics||[])[0]||'General',difficulty:r.difficulty||'medium',pathway:data.pathway||'skill',status:'pending'});ids.add(id);added++}save();render();alert(`Imported ${added} questions into teacher review. Skipped existing IDs.`)}catch(e){alert('Import rejected: '+e.message)}}
function createQuiz(){const title=$('quizTitle').value.trim(),subject=$('quizSubject').value,mode=$('quizMode').value,min=Number($('quizMinutes').value);if(!title)return alert('Enter a quiz title.');if(mode==='exam'&&(!Number.isFinite(min)||min<=0))return alert('Enter a positive duration.');const qs=db.questions.filter(q=>q.status==='approved'&&q.subject===subject);if(!qs.length)return alert('No approved questions for subject.');db.quizzes.push({id:'q'+Date.now(),title,pathway:qs[0].pathway,subject,topic:'All topics',mode,duration:mode==='exam'?Math.round(min*60):0,questionIds:qs.map(q=>q.id),published:true});save();render();alert('Quiz published in student view.')}
function admin(){const approved=db.questions.filter(q=>q.status==='approved').length;return `<div class="panel"><h2>Admin overview</h2><div class="grid"><div class="stat"><strong>${db.questions.length}</strong>Questions</div><div class="stat"><strong>${approved}</strong>Approved</div><div class="stat"><strong>${db.quizzes.length}</strong>Quizzes</div><div class="stat"><strong>${db.attempts.length}</strong>Attempts</div></div><h3>Content coverage</h3>${uniq(db.questions.map(q=>q.pathway)).map(p=>`<div class="item"><b>${esc(p)}</b> · ${db.questions.filter(q=>q.pathway===p).length} questions · ${uniq(db.questions.filter(q=>q.pathway===p).map(q=>q.subject)).map(esc).join(', ')}</div>`).join('')}<p class="notice">User management and access control are planned for the deployed Supabase version; this demo does not authenticate users.</p></div>`}
function analytics(){const attempts=db.attempts;return `<div class="panel"><h2>Performance analytics</h2><p class="muted">Practice and Exam results are kept separate. The figures below use only attempts made in this browser.</p><div class="grid">${['practice','exam'].map(mode=>{const a=attempts.filter(x=>x.mode===mode),total=a.reduce((s,x)=>s+x.total,0),correct=a.reduce((s,x)=>s+x.score,0);return `<div class="stat"><b>${mode==='practice'?'Practice':'Exam'}</b><strong>${total?Math.round(correct/total*100)+'%':'—'}</strong><span class="muted">${a.length} attempts · ${total} responses</span></div>`}).join('')}</div><h3>Topic performance</h3>${uniq(attempts.flatMap(a=>a.responses.map(r=>r.topic))).map(topic=>`<div class="item"><b>${esc(topic)}</b>${['practice','exam'].map(mode=>{const r=attempts.filter(a=>a.mode===mode).flatMap(a=>a.responses).filter(r=>r.topic===topic),n=r.length,c=r.filter(x=>x.correct).length;return `<p class="muted">${mode}: ${n?Math.round(c/n*100)+'%':'No attempts'} (${n} questions)</p><div class="bar"><span style="width:${n?100*c/n:0}%"></span></div>`}).join('')}</div>`).join('')||'<p class="muted">Complete a quiz to populate analytics.</p>'}<h3>Attempt history</h3>${attempts.slice().reverse().map(a=>`<div class="item"><b>${esc(a.title)}</b> <span class="pill">${a.mode}</span><p class="muted">${a.score}/${a.total} · ${a.elapsed}s · ${new Date(a.at).toLocaleString()}</p></div>`).join('')||'<p class="muted">No attempts yet.</p>'}</div>`}
render();
</script><script src="tie-config.js"></script><script src="tie-client.js"></script><script src="tie-ui.js"></script></body></html>
